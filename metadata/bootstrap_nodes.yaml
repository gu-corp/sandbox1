# Consensus-layer bootstrap nodes (ENRs) for sandbox1.
#
# Not an official list. These were read from a beacon node's own
# /eth/v1/node/identity and kept only if their advertised TCP port answered.
#
# https://rpc-1.sandbox1.japanopenchain.org:3500 sits in front of at least seven
# beacon nodes and hands out a different identity per request. Six of the seven
# advertise a p2p address whose port does not accept connections from outside,
# so only the reachable one is listed here.
#
# The address is a bare IPv4, not a DNS name, so it will rot when the node is
# replaced. scripts/check_bootnodes.sh tests it, and CI runs weekly so the rot
# surfaces without anyone having to look.
#
# The execution layer still publishes no bootnodes; there is no enodes.yaml.

