# Execution-layer bootnodes (enode URLs) for sandbox1.
#
# Supplied by the network operators. The host is the same machine that runs the
# consensus-layer bootnode in ./bootstrap_nodes.yaml, on the standard geth p2p
# port.
#
# Note the weaker guarantee compared with the consensus side. For an ENR,
# scripts/discv5_probe.py makes the node answer WHOAREYOU, which binds the key
# in the record to whatever is listening. There is no equally cheap equivalent
# here: proving this node id belongs to that address needs a full RLPx
# handshake (ECIES over secp256k1 ECDH), so scripts/check_bootnodes.sh only
# checks the URL is well formed and the port accepts TCP.

